apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  labels:
    ccm: external
    csi: external
  name: "${CLUSTER_NAME}"
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
      - 192.168.0.0/16
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta1
    kind: KubeadmControlPlane
    name: "${CLUSTER_NAME}-control-plane"
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
    kind: HuaweiCloudCluster
    name: "${CLUSTER_NAME}"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: HuaweiCloudCluster
metadata:
  name: "${CLUSTER_NAME}"
spec:
  region: "${HC_REGION}"
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: KubeadmControlPlane
metadata:
  name: "${CLUSTER_NAME}-control-plane"
spec:
  kubeadmConfigSpec:
    clusterConfiguration:
      apiServer:
        extraArgs:
          cloud-provider: external
      controllerManager:
        extraArgs:
          cloud-provider: external
    initConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
          cloud-provider: external
        name: '{{ ds.meta_data.local_hostname }}'
    joinConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
          cloud-provider: external
        name: '{{ ds.meta_data.local_hostname }}'
  machineTemplate:
    infrastructureRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
      kind: HuaweiCloudMachineTemplate
      name: "${CLUSTER_NAME}-control-plane"
  replicas: ${CONTROL_PLANE_MACHINE_COUNT}
  version: "${KUBERNETES_VERSION}"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: HuaweiCloudMachineTemplate
metadata:
  name: "${CLUSTER_NAME}-control-plane"
spec:
  template:
    spec:
      imageRef: "${ECS_IMAGE_ID}"
      flavorRef: "${HC_CONTROL_PLANE_MACHINE_TYPE}"
      publicIP: true
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: "${CLUSTER_NAME}-md-0"
spec:
  clusterName: "${CLUSTER_NAME}"
  replicas: ${WORKER_MACHINE_COUNT}
  selector:
    matchLabels: null
  template:
    spec:
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
          name: "${CLUSTER_NAME}-md-0"
      clusterName: ${CLUSTER_NAME}
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: HuaweiCloudMachineTemplate
        name: "${CLUSTER_NAME}-md-0"
      version: ${KUBERNETES_VERSION}
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: KubeadmConfigTemplate
metadata:
  name: "${CLUSTER_NAME}-md-0"
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
            cloud-provider: external
          name: '{{ ds.meta_data.local_hostname }}'
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: HuaweiCloudMachineTemplate
metadata:
  name: "${CLUSTER_NAME}-md-0"
spec:
  template:
    spec:
      imageRef: "${ECS_IMAGE_ID}"
      flavorRef: "${HC_NODE_MACHINE_TYPE}"
      publicIP: true
---
apiVersion: addons.cluster.x-k8s.io/v1beta1
kind: ClusterResourceSet
metadata:
  name: crs-ccm
spec:
  clusterSelector:
    matchLabels:
      ccm: external
  resources:
  - kind: ConfigMap
    name: cloud-controller-manager-addon
  strategy: ApplyOnce
---
apiVersion: v1
data:
  hw-cp-external.yaml: |
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: system:cloud-controller-manager
    rules:
      - resources:
          - tokenreviews
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
        apiGroups:
          - authentication.k8s.io
      - resources:
          - configmaps
          - endpoints
          - pods
          - services
          - secrets
          - serviceaccounts
          - serviceaccounts/token
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
        apiGroups:
          - ''
      - resources:
          - nodes
        verbs:
          - get
          - list
          - watch
          - delete
          - patch
          - update
        apiGroups:
          - ''
      - resources:
          - services/status
          - pods/status
        verbs:
          - update
          - patch
        apiGroups:
          - ''
      - resources:
          - nodes/status
        verbs:
          - patch
          - update
        apiGroups:
          - ''
      - resources:
          - events
          - endpoints
        verbs:
          - create
          - patch
          - update
        apiGroups:
          - ''
      - resources:
          - leases
        verbs:
          - get
          - update
          - create
          - delete
        apiGroups:
          - coordination.k8s.io
      - resources:
          - customresourcedefinitions
        verbs:
          - get
          - update
          - create
          - delete
        apiGroups:
          - apiextensions.k8s.io
      - resources:
          - ingresses
        verbs:
          - get
          - list
          - watch
          - update
          - create
          - patch
          - delete
        apiGroups:
          - networking.k8s.io
      - resources:
          - ingresses/status
        verbs:
          - update
          - patch
        apiGroups:
          - networking.k8s.io
      - resources:
          - endpointslices
        verbs:
          - get
          - list
          - watch
        apiGroups:
          - discovery.k8s.io
    ---
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: cloud-controller-manager
      namespace: kube-system
    ---
    kind: ClusterRoleBinding
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: system:cloud-controller-manager
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: system:cloud-controller-manager
    subjects:
      - kind: ServiceAccount
        name: cloud-controller-manager
        namespace: kube-system
    ---
    apiVersion: apps/v1
    kind: DaemonSet
    metadata:
      name: huawei-cloud-controller-manager
      namespace: kube-system
      labels:
        k8s-app: huawei-cloud-controller-manager
    spec:
      selector:
        matchLabels:
          k8s-app: huawei-cloud-controller-manager
      template:
        metadata:
          labels:
            k8s-app: huawei-cloud-controller-manager
        spec:
          nodeSelector:
            kubernetes.io/os: linux
          securityContext:
            runAsUser: 1001
          tolerations:
            - key: node.cloudprovider.kubernetes.io/uninitialized
              value: "true"
              effect: NoSchedule
            - key: node-role.kubernetes.io/master
              effect: NoSchedule
            - key: node-role.kubernetes.io/control-plane
              effect: NoSchedule
          serviceAccountName: cloud-controller-manager
          containers:
            - name: huawei-cloud-controller-manager
              image: swr.cn-north-4.myhuaweicloud.com/k8s-cloudprovider/huawei-cloud-controller-manager:v0.26.9
              args:
                - /bin/huawei-cloud-controller-manager
                - --v=5
                - --cloud-config=/etc/config/cloud-config
                - --cloud-provider=huaweicloud
                - --use-service-account-credentials=true
                - --node-status-update-frequency=5s
                - --node-monitor-period=5s
                - --leader-elect-lease-duration=30s
                - --leader-elect-renew-deadline=20s
                - --leader-elect-retry-period=2s
              volumeMounts:
                - mountPath: /etc/kubernetes
                  name: k8s-certs
                  readOnly: true
                - mountPath: /etc/ssl/certs
                  name: ca-certs
                  readOnly: true
                - mountPath: /etc/config
                  name: cloud-config-volume
                  readOnly: true
                - mountPath: /usr/libexec/kubernetes/kubelet-plugins/volume/exec
                  name: flexvolume-dir
              resources:
                requests:
                  cpu: 200m
                  memory: 100Mi
                limits:
                  cpu: 2
                  memory: 2Gi
          hostNetwork: true
          volumes:
            - hostPath:
                path: /usr/libexec/kubernetes/kubelet-plugins/volume/exec
                type: DirectoryOrCreate
              name: flexvolume-dir
            - hostPath:
                path: /etc/kubernetes
                type: DirectoryOrCreate
              name: k8s-certs
            - hostPath:
                path: /etc/ssl/certs
                type: DirectoryOrCreate
              name: ca-certs
            - name: cloud-config-volume
              secret:
                secretName: cloud-config
kind: ConfigMap
metadata:
  annotations:
    note: generated
  labels:
    type: generated
  name: cloud-controller-manager-addon
